<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WD Launcher OS - Termux Hybrid</title>
    <style>
        :root {
            --bg-color: #0a0b10;
            --main-color: #00ffcc;
            --accent-color: #ff007f;
            --card-bg: rgba(16, 20, 32, 0.85);
            --text-color: #e0e6ed;
            --font-family: 'Fira Code', 'Courier New', monospace;
        }

        /* Themes */
        body.theme-matrix {
            --bg-color: #020d04;
            --main-color: #00ff41;
            --accent-color: #008f11;
            --card-bg: rgba(5, 20, 10, 0.85);
            --text-color: #00ff41;
        }

        body.theme-dracula {
            --bg-color: #282a36;
            --main-color: #bd93f9;
            --accent-color: #ff79c6;
            --card-bg: rgba(40, 42, 54, 0.85);
            --text-color: #f8f8f2;
        }

        body.theme-cyberpunk {
            --bg-color: #0a0b10;
            --main-color: #00ffcc;
            --accent-color: #ff007f;
            --card-bg: rgba(16, 20, 32, 0.85);
            --text-color: #e0e6ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 10px;
            gap: 8px;
        }

        /* Header & Dashboard */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            padding: 8px 14px;
        }

        .clock {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--main-color);
            text-shadow: 0 0 8px var(--main-color);
        }

        .sys-info-pills {
            display: flex;
            gap: 10px;
            font-size: 0.75rem;
        }

        .pill {
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mode-toggle {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--main-color);
            color: var(--main-color);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
        }

        /* Terminal View */
        .terminal-view {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .terminal-output {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(0, 255, 204, 0.2);
        }

        .prompt-str {
            color: var(--main-color);
            margin-right: 8px;
            font-weight: bold;
        }

        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
        }

        /* GUI View */
        .gui-view {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 12px;
            overflow-y: auto;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            color: var(--text-color);
            font-family: inherit;
            outline: none;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 12px;
        }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .app-card:hover {
            border-color: var(--main-color);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            transform: translateY(-2px);
        }

        .app-icon {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--main-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            margin-bottom: 6px;
            font-size: 1.2rem;
        }

        .app-name {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-color);
        }

        /* Virtual Key Bar */
        .key-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .key-btn:active {
            background: var(--main-color);
            color: #000;
        }
    </style>
</head>
<body class="theme-cyberpunk">
    <canvas id="matrix-bg"></canvas>
    
    <div class="container">
        <!-- HEADER / TELEMETRY DASHBOARD -->
        <div class="header-bar">
            <div class="clock" id="clock">00:00:00</div>
            <div class="sys-info-pills">
                <div class="pill">CPU: <span id="cpu-val">14%</span></div>
                <div class="pill">RAM: <span id="ram-val">3.8GB</span></div>
                <div class="pill">BAT: <span id="bat-val">92%</span></div>
            </div>
            <button class="mode-toggle" id="mode-btn" onclick="toggleMode()">GUI MODE</button>
        </div>

        <!-- TERMINAL VIEW -->
        <div class="terminal-view" id="term-view">
            <div class="terminal-output" id="output">Welcome to WD Launcher OS (Termux Hybrid) v3.0
Type 'help' to show all available commands.

[system] Shell ready. Current theme: Cyberpunk.
</div>
            <div class="prompt-line">
                <span class="prompt-str">wd@android:~$</span>
                <input type="text" class="cmd-input" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>

        <!-- GUI APPS VIEW -->
        <div class="gui-view" id="gui-view">
            <input type="text" class="search-box" id="search-box" placeholder="Search app or type command..." oninput="filterApps()">
            <div class="app-grid" id="app-grid"></div>
        </div>

        <!-- BOTTOM TOOLBAR -->
        <div class="key-bar">
            <button class="key-btn" onclick="runCmd('help')">HELP</button>
            <button class="key-btn" onclick="runCmd('neofetch')">NEOFETCH</button>
            <button class="key-btn" onclick="runCmd('apps')">APPS</button>
            <button class="key-btn" onclick="runCmd('top')">HTOP</button>
            <button class="key-btn" onclick="runCmd('weather Moscow')">WEATHER</button>
            <button class="key-btn" onclick="runCmd('theme matrix')">MATRIX</button>
            <button class="key-btn" onclick="runCmd('clear')">CLEAR</button>
        </div>
    </div>

    <script>
        // Matrix Background Effect
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 11, 16, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--main-color') || '#00ffcc';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // Clock & Live Telemetry Simulation
        function updateTelemetry() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('cpu-val').innerText = (10 + Math.floor(Math.random() * 20)) + '%';
            document.getElementById('ram-val').innerText = (3.2 + Math.random() * 0.4).toFixed(1) + 'GB';
        }
        setInterval(updateTelemetry, 1000);
        updateTelemetry();

        // View Mode Switcher
        let isGuiMode = false;
        function toggleMode() {
            isGuiMode = !isGuiMode;
            document.getElementById('term-view').style.display = isGuiMode ? 'none' : 'flex';
            document.getElementById('gui-view').style.display = isGuiMode ? 'flex' : 'none';
            document.getElementById('mode-btn').innerText = isGuiMode ? 'TERM MODE' : 'GUI MODE';
            if (isGuiMode) renderApps(sampleApps);
        }

        const sampleApps = [
            { name: "Browser", icon: "🌐" },
            { name: "Termux Shell", icon: ">_" },
            { name: "Settings", icon: "⚙️" },
            { name: "File Manager", icon: "📁" },
            { name: "Gallery", icon: "🖼️" },
            { name: "Camera", icon: "📷" },
            { name: "Music Player", icon: "🎵" },
            { name: "Telegram", icon: "💬" },
            { name: "YouTube", icon: "▶️" },
            { name: "GitHub", icon: "🐙" }
        ];

        function renderApps(list) {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            list.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `<div class="app-icon">${app.icon}</div><div class="app-name">${app.name}</div>`;
                card.onclick = () => printOutput(`Launching application: ${app.name}...`);
                grid.appendChild(card);
            });
        }

        function filterApps() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = sampleApps.filter(a => a.name.toLowerCase().includes(query));
            renderApps(filtered);
        }

        // Terminal Input Engine
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('output');
        const cmdHistory = [];
        let historyIdx = -1;

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                input.value = '';
                if (cmd) {
                    cmdHistory.push(cmd);
                    historyIdx = cmdHistory.length;
                    runCmd(cmd);
                }
            } else if (e.key === 'ArrowUp') {
                if (historyIdx > 0) {
                    historyIdx--;
                    input.value = cmdHistory[historyIdx];
                }
            } else if (e.key === 'ArrowDown') {
                if (historyIdx < cmdHistory.length - 1) {
                    historyIdx++;
                    input.value = cmdHistory[historyIdx];
                } else {
                    historyIdx = cmdHistory.length;
                    input.value = '';
                }
            }
        });

        function printOutput(text) {
            output.innerText += `\n` + text;
            output.scrollTop = output.scrollHeight;
        }

        function runCmd(cmdStr) {
            printOutput(`wd@android:~$ ${cmdStr}`);
            const args = cmdStr.trim().split(' ');
            const mainCmd = args[0].toLowerCase();

            switch (mainCmd) {
                case 'help':
                    printOutput(`
System Commands List:
 - neofetch       : System Overview
 - apps           : Show all launcher applications
 - launch [name]  : Launch an application
 - top / htop     : Real-time process & resource viewer
 - weather [city] : Get ASCII weather forecast
 - theme [name]   : Switch UI theme (cyberpunk / matrix / dracula)
 - play / pause   : Media player control
 - clear          : Clear terminal screen
 - gui            : Toggle GUI mode
                    `);
                    break;

                case 'neofetch':
                    printOutput(`
   .-.      WD Launcher Hybrid OS
  (o.o)     ---------------------
   |=|      OS: Android 14 / Linux Kernel
  __|__     Shell: Termux-Hybrid v3.0
 /  .  \    Themes: Cyberpunk, Matrix, Dracula
| U   U |   Uptime: 12 hours 34 mins
 \  -  /    RAM Usage: 3.8GB / 8.0GB
  \`---\`
                    `);
                    break;

                case 'apps':
                    printOutput(`Installed Applications:\n` + sampleApps.map(a => ` - ${a.name}`).join('\n'));
                    break;

                case 'launch':
                    if (args.length > 1) {
                        printOutput(`[exec] Opening package: ${args.slice(1).join(' ')}`);
                    } else {
                        printOutput(`Usage: launch [app_name]`);
                    }
                    break;

                case 'top':
                case 'htop':
                    printOutput(`
PID  USER     PR  NI  VIRT   RES   SHR S  %CPU  %MEM     TIME+ COMMAND
 102 root     20   0  1.2g  120m   45m S   8.5   3.1   0:14.22 system_server
 405 wd       20   0  450m   85m   30m R  14.2   2.1   0:08.10 wdlauncher
 812 surface  20   0  310m   42m   18m S   2.1   1.0   0:02.44 surfaceflinger
                    `);
                    break;

                case 'weather':
                    const city = args[1] || 'Moscow';
                    printOutput(`
Weather forecast for ${city}:
  \   /     Clear / Sunny
   .-.      Temperature: +21°C
  (   )     Wind: 4 m/s NW
   \`-\`      Humidity: 45%
  /   \
                    `);
                    break;

                case 'theme':
                    const themeName = (args[1] || '').toLowerCase();
                    if (['cyberpunk', 'matrix', 'dracula'].includes(themeName)) {
                        document.body.className = `theme-${themeName}`;
                        printOutput(`[ok] Applied theme: ${themeName}`);
                    } else {
                        printOutput(`Usage: theme [cyberpunk | matrix | dracula]`);
                    }
                    break;

                case 'play':
                case 'pause':
                    printOutput(`[media] Media playback status toggled.`);
                    break;

                case 'clear':
                    output.innerText = '';
                    break;

                case 'gui':
                    toggleMode();
                    break;

                default:
                    printOutput(`Command not found: ${mainCmd}. Type 'help' for command list.`);
            }
        }
    </script>
</body>
</html>
